backend:
  name: github
  repo: your-github-username/khelang-website   # เปลี่ยนเป็น username/ชื่อ repository ของคุณ
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "events"
    label: "กิจกรรมและข่าวสาร"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-activity-{{slug}}"
    fields:
      - { label: "หัวข้อข่าว", name: "title", widget: "string" }
      - { label: "วันที่เผยแพร่", name: "date", widget: "datetime" }
      - { label: "รายละเอียดข่าว", name: "body", widget: "markdown" }
      - { label: "รูปภาพแกลเลอรี", name: "gallery", widget: "list", field: { label: "รูปภาพ", name: "image", widget: "image" } }
